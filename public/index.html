
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-4">
        <h1>Loan EMI Calculator</h1>
        <p class="text-muted">Calculate your monthly loan installments</p>
    </div>

    <div class="card shadow p-4 mb-4">
        <h4 class="mb-3">Loan Details</h4>

        <form id="emiForm">

            <div class="mb-3">
                <label for="loanAmount" class="form-label">Loan Amount (Rs.)</label>
                <input type="number" class="form-control" id="loanAmount"
                       min="0.01" step="any" required>
            </div>

            <div class="mb-3">
                <label for="interestRate" class="form-label">Annual Interest Rate (%)</label>
                <input type="number" class="form-control" id="interestRate"
                       min="0.01" step="any" required>
            </div>

            <div class="mb-3">
                <label for="tenure" class="form-label">Loan Tenure (Months)</label>
                <input type="number" class="form-control" id="tenure"
                       min="1" step="1" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Calculate EMI
            </button>

        </form>

        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
    </div>

    <!-- Calculation Result -->
    <div id="resultPanel" class="card shadow p-4 mb-4 d-none">
        <h4 class="mb-3">Calculation Result</h4>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="result-box">
                    <p>Monthly EMI</p>
                    <h4 id="emiResult"></h4>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="result-box">
                    <p>Total Payment</p>
                    <h4 id="totalPayment"></h4>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="result-box">
                    <p>Total Interest</p>
                    <h4 id="totalInterest"></h4>
                </div>
            </div>
        </div>

        <p class="text-muted mb-0">
            Served by: <span id="servedBy"></span>
            | Pod IP: <span id="podIP"></span>
        </p>
    </div>

    <!-- History Table -->
    <div class="card shadow p-4">
        <h4 class="mb-3">Calculation History</h4>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Loan Amount</th>
                        <th>Rate (%)</th>
                        <th>Months</th>
                        <th>EMI</th>
                        <th>Served By</th>
                    </tr>
                </thead>

                <tbody id="historyTable">
                    <tr>
                        <td colspan="5" class="text-center">
                            Loading history...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Custom JavaScript -->
<script src="script.js"></script>

</body>
</html>
