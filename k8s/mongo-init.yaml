
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:8.0
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for MongoDB nodes..."

              until mongosh --host mongo-0.mongo:27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                sleep 5
              done

              until mongosh --host mongo-1.mongo:27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                sleep 5
              done

              until mongosh --host mongo-2.mongo:27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                sleep 5
              done

              echo "Initializing replica set..."

              mongosh --host mongo-0.mongo:27017 --quiet --eval '
                try {
                  rs.status();
                  print("Replica set is already initialized.");
                } catch (e) {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  });
                }
              '

              echo "Waiting for replica set election..."

              until mongosh --host mongo-0.mongo:27017 --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do
                sleep 5
              done

              echo "Replica set status:"
              mongosh --host mongo-0.mongo:27017 --quiet --eval 'rs.status()'
